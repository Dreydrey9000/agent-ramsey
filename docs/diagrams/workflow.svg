<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">Agent RAMsey workflow</title><desc id="desc">A user or assistant calls the validated CLI. Bounded Mac measurements and private local state produce an evidence report. The human chooses any next action.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="880" height="500" fill="#fff"/>
<g font-family="system-ui,sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">
<text x="440" y="32" font-size="22" font-weight="600">Agent RAMsey: on-demand evidence</text>
<g stroke="#475569" fill="#f1f5f9"><rect x="270" y="55" width="340" height="46" rx="6"/><rect x="270" y="131" width="340" height="46" rx="6"/><rect x="35" y="224" width="390" height="75" rx="6"/><rect x="455" y="224" width="390" height="75" rx="6"/><rect x="270" y="353" width="340" height="46" rx="6"/><rect x="270" y="435" width="340" height="46" rx="6"/></g>
<text x="440" y="84">Human or coding assistant</text><text x="440" y="160">Validated CLI command</text>
<text x="230" y="253">Bounded native Mac readings</text><text x="230" y="280" font-size="14">CPU, RSS, listener metadata, battery, thermals</text>
<text x="650" y="253">Private local state</text><text x="650" y="280" font-size="14">Selected history and expiring work registrations</text>
<text x="440" y="382">Evidence report or capacity advice</text><text x="440" y="464">Human chooses a next step</text>
</g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M440 101V128"/><path d="M390 177L230 220"/><path d="M490 177L650 220"/><path d="M230 299L390 349"/><path d="M650 299L490 349"/><path d="M440 399V431"/></g>
</svg>
